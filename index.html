<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Extractor with Regex</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Data Extractor Using Regular Expressions</h1>
        <h2>Darlene regex data extraction</h2>
        <p>Paste your text below and click "Extract All" to find emails, URLs, phone numbers, credit cards, times, HTML tags, hashtags, and currency amounts.</p>
        
        <textarea id="inputText" placeholder="Enter text here... (e.g., user@example.com, https://www.example.com, (123) 456-7890, etc.)" rows="10" cols="80"></textarea>
        
        <button id="extractBtn">Extract All</button>
        <button id="clearBtn">Clear</button>
        
        <div id="results">
            <!-- Results will be dynamically inserted here -->
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
